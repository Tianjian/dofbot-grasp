name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Type check
        run: mypy src
      - name: Unit tests
        run: pytest -q

  # Grasp-rate gate. The trial drives the shared controller (dofbot_grasp.controller)
  # through the MuJoCo cell, so it measures the sequence the arm will run.
  #
  # Baseline at the time of arming: 3 of 4 cube positions grasped (0.75), lifting 49-52 mm.
  # A change that drops below the threshold fails the build.
  sim-grasp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          sudo apt-get update && sudo apt-get install -y libosmesa6 libgl1
      - name: Grasp trial
        env:
          MUJOCO_GL: osmesa
        run: python sim/grasp_trial.py --min-rate 0.75
